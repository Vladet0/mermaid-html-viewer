# Dependabot for markdown-mermaid-viewer
#
# This repo has two manifests at the root:
#   package.json / package-lock.json  →  npm
#   Dockerfile (FROM node:20-alpine)  →  docker
#
# There are no GitHub Actions workflows, no private registries, and no
# devDependencies. Security updates are not delayed by cooldown.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    # All four runtime libraries: express, markdown-it, mermaid, sanitize-html.
    allow:
      - dependency-type: production
    versioning-strategy: increase
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    # Mermaid majors stay ungrouped. A major bump can change diagram syntax
    # (gitGraph, flowchart comments) and should be reviewed on its own.

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore
      include: scope
    # Stay on the Node 20 line used by the Dockerfile and engines.node.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
